name: Validate and deploy Pages

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Validate articles.json
        run: npm run validate:articles

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir artifact
          rsync -a --delete ./docs/ artifact/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifact

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
