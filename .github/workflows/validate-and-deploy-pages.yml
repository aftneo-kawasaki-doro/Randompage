name: Validate and deploy Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Validate articles.json
        run: |
          python scripts/validate_articles.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Pages artifact
        run: |
          # Copy repository files to artifact dir excluding git and workflow scripts
          mkdir -p artifact
          rsync -a --exclude='.git' --exclude='.github' --exclude='scripts' --exclude='README.md' --exclude='.gitignore' ./ artifact/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifact

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
